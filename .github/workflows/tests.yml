name: Katherine automated tests

on:
  push:
    paths:
      - "main.py"
      - "katherine_nexus.py"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "tests/**"
      - "requirements-test.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Compile bot source
        run: python -m py_compile main.py katherine_nexus.py

      - name: Run automated tests
        run: python -m pytest -q
