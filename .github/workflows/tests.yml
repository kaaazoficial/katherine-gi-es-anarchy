name: Katherine automated tests

on:
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - "katherine_nexus.py"
      - "katherine_astra.py"
      - "katherine_ai.py"
      - "katherine_research.py"
      - "katherine_retention.py"
      - "tests/**"
      - "requirements-test.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - "requirements-test.txt"
      - "pytest.ini"
      - "katherine_nexus.py"
      - "katherine_astra.py"
      - "katherine_ai.py"
      - "katherine_research.py"
      - "katherine_retention.py"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Compile bot source
        run: python -m py_compile main.py katherine_nexus.py katherine_astra.py katherine_ai.py katherine_research.py katherine_retention.py

      - name: Run automated tests
        run: python -m pytest -q
