name: Katherine automated tests

on:
  push:
    paths:
      - "main.py"
      - "katherine_identity.py"
      - "katherine_language.py"
      - "requirements.txt"
      - "katherine_nexus.py"
      - "katherine_astra.py"
      - "katherine_ai.py"
      - "katherine_research.py"
      - "katherine_retention.py"
      - "katherine_config.py"
      - "katherine_game_queries.py"
      - "katherine_matching.py"
      - "katherine_metrics.py"
      - "katherine_topics.py"
      - "katherine_help.py"
      - "katherine_storage.py"
      - "katherine_images.py"
      - "tests/**"
      - "requirements-test.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "katherine_identity.py"
      - "katherine_language.py"
      - "requirements.txt"
      - "tests/**"
      - "requirements-test.txt"
      - "pytest.ini"
      - "katherine_nexus.py"
      - "katherine_astra.py"
      - "katherine_ai.py"
      - "katherine_research.py"
      - "katherine_retention.py"
      - "katherine_config.py"
      - "katherine_game_queries.py"
      - "katherine_matching.py"
      - "katherine_metrics.py"
      - "katherine_topics.py"
      - "katherine_help.py"
      - "katherine_storage.py"
      - "katherine_images.py"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Compile bot source
        run: python -m compileall -q .

      - name: Report top startup import costs
        run: |
          python -X importtime -c "import main" 2> /tmp/katherine-importtime.log
          python - <<'PY'
          from pathlib import Path

          entries = []
          for line in Path("/tmp/katherine-importtime.log").read_text().splitlines():
              if not line.startswith("import time:"):
                  continue
              fields = line.split("|")
              if len(fields) < 3:
                  continue
              try:
                  # Format: self-us | cumulative-us | module.
                  cumulative_us = float(fields[1].strip())
              except (IndexError, ValueError):
                  continue
              module = fields[2].strip() if len(fields) > 2 else "unknown"
              entries.append((cumulative_us, module))

          print("Top cumulative import costs (Python importtime; milliseconds):")
          for elapsed, module in sorted(entries, reverse=True)[:20]:
              print(f"{elapsed / 1000:8.2f} ms  {module}")
          PY

      - name: Run automated tests with coverage
        run: python -m pytest -q --ignore=tests/integration --cov=main --cov=katherine_language --cov=katherine_identity --cov=katherine_ai --cov=katherine_nexus --cov=katherine_astra --cov=katherine_research --cov=katherine_retention --cov=katherine_help --cov=katherine_storage --cov=katherine_images --cov-report=term-missing --timeout=120


  integration:
    name: Webhook integration smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Compile bot source
        run: python -m compileall -q .

      - name: Run isolated webhook integration tests
        run: python -m pytest -q tests/integration --timeout=30
