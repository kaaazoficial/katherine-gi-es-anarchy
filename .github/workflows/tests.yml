name: Katherine automated tests

on:
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - "katherine_nexus.py"
      - "katherine_astra.py"
      - "katherine_ai.py"
      - "katherine_research.py"
      - "katherine_retention.py"
      - "katherine_config.py"
      - "katherine_game_queries.py"
      - "katherine_matching.py"
      - "katherine_metrics.py"
      - "katherine_topics.py"
      - "tests/**"
      - "requirements-test.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - "requirements-test.txt"
      - "pytest.ini"
      - "katherine_nexus.py"
      - "katherine_astra.py"
      - "katherine_ai.py"
      - "katherine_research.py"
      - "katherine_retention.py"
      - "katherine_config.py"
      - "katherine_game_queries.py"
      - "katherine_matching.py"
      - "katherine_metrics.py"
      - "katherine_topics.py"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Compile bot source
        run: python -m compileall -q .

      - name: Run automated tests with coverage
        run: python -m pytest -q --ignore=tests/integration --cov=main --cov=katherine_ai --cov=katherine_nexus --cov=katherine_astra --cov=katherine_research --cov=katherine_retention --cov-report=term-missing --timeout=120


  integration:
    name: Webhook integration smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-test.txt

      - name: Compile bot source
        run: python -m compileall -q .

      - name: Run isolated webhook integration tests
        run: python -m pytest -q tests/integration --timeout=30
