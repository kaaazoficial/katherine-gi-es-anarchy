name: Katherine dependency security audit

on:
  push:
    branches:
      - "**"
    paths:
      - "requirements.txt"
      - "requirements-test.txt"
      - "requirements-dev.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "requirements.txt"
      - "requirements-test.txt"
      - "requirements-dev.txt"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pip-audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install audit tooling
        run: python -m pip install "pip-audit>=2.10.1,<3.0.0"

      - name: Audit production dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Audit development and test dependencies
        run: python -m pip_audit -r requirements-dev.txt --strict
