name: Katherine quality and dependency security

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/quality-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - ".github/workflows/quality-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            requirements-dev.txt

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Ruff static analysis (baseline report)
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Bandit security scan (baseline report)
        run: bandit -r . -x ./tests,./.git -ll
        continue-on-error: true

      - name: Audit production dependencies
        run: pip-audit -r requirements.txt

      - name: Validate dependency metadata
        run: python -m pip check

      - name: Compile bot source
        run: python -m py_compile main.py katherine_nexus.py katherine_astra.py katherine_ai.py katherine_research.py katherine_retention.py
